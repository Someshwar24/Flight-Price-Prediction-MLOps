apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-price-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flight-price-api
  template:
    metadata:
      labels:
        app: flight-price-api
    spec:
      containers:
        - name: flight-price-api
          image: flight-price-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flight-price-service
spec:
  type: NodePort
  selector:
    app: flight-price-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080